<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atlas — Travel & Lifestyle Assistant</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f4f4f5;
      --surface: #ffffff;
      --border: #e4e4e7;
      --text: #18181b;
      --text-muted: #71717a;
      --user-bg: #2563eb;
      --user-text: #ffffff;
      --atlas-bg: #ffffff;
      --atlas-text: #27272a;
      --atlas-label: #52525b;
      --input-bg: #ffffff;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      flex-shrink: 0;
      padding: 1rem 1.25rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    header p {
      margin-top: 0.15rem;
      font-size: 0.8125rem;
      color: var(--text-muted);
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .row {
      display: flex;
      width: 100%;
    }

    .row.user { justify-content: flex-end; }
    .row.assistant { justify-content: flex-start; }

    .bubble-wrap {
      display: flex;
      flex-direction: column;
      max-width: min(75%, 36rem);
      gap: 0.25rem;
    }

    .row.user .bubble-wrap { align-items: flex-end; }
    .row.assistant .bubble-wrap { align-items: flex-start; }

    .sender {
      font-size: 0.75rem;
      color: var(--atlas-label);
      padding: 0 0.25rem;
    }

    .row.user .sender { display: none; }

    .bubble {
      padding: 0.65rem 0.9rem;
      border-radius: 1rem;
      line-height: 1.55;
      font-size: 0.9375rem;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: var(--shadow);
    }

    .bubble.user {
      background: var(--user-bg);
      color: var(--user-text);
      border-bottom-right-radius: 0.25rem;
    }

    .bubble.assistant {
      background: var(--atlas-bg);
      color: var(--atlas-text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 0.25rem;
    }

    .bubble.error {
      border-color: #fecaca;
      background: #fef2f2;
      color: #991b1b;
    }

    .bubble.status {
      background: #fafafa;
      color: var(--text-muted);
      font-style: italic;
      border-style: dashed;
    }

    .composer {
      flex-shrink: 0;
      display: flex;
      gap: 0.5rem;
      padding: 0.875rem 1.25rem;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    #user-input {
      flex: 1;
      padding: 0.7rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 0.625rem;
      background: var(--input-bg);
      color: var(--text);
      font-size: 0.9375rem;
      outline: none;
      transition: border-color 0.15s;
    }

    #user-input:focus {
      border-color: #93c5fd;
    }

    #user-input:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #send-btn {
      padding: 0.7rem 1.1rem;
      background: var(--user-bg);
      color: var(--user-text);
      border: none;
      border-radius: 0.625rem;
      font-size: 0.9375rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    #send-btn:hover:not(:disabled) { background: #1d4ed8; }
    #send-btn:disabled { opacity: 0.55; cursor: not-allowed; }

    @media (max-width: 480px) {
      .bubble-wrap { max-width: 88%; }
      header, .composer { padding-left: 1rem; padding-right: 1rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Atlas</h1>
    <p>Travel & lifestyle assistant — weather, news, and recommendations</p>
  </header>

  <div id="messages" aria-live="polite"></div>

  <form class="composer" id="chat-form">
    <input
      type="text"
      id="user-input"
      placeholder="Ask about weather, news, or trip planning…"
      autocomplete="off"
      aria-label="Message"
    />
    <button type="submit" id="send-btn">Send</button>
  </form>

  <script>
    const API_URL = "http://localhost:8000/chat/stream";
    const WELCOME =
      "Hi, I'm Atlas. I can check live weather, forecast your trip, and pull the latest news for any city. What would you like to know?";

    const form = document.getElementById("chat-form");
    const input = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const messagesEl = document.getElementById("messages");

    let conversationHistory = [];
    let isBusy = false;

    appendAssistantMessage(WELCOME, { stream: false });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || isBusy) return;

      appendUserMessage(text);
      input.value = "";
      setBusy(true);

      const statusIndicator = appendStatusIndicator("Atlas is thinking...");

      try {
        const result = await streamChat(text, conversationHistory, (message) => {
          statusIndicator.setMessage(message);
        });

        statusIndicator.remove();

        conversationHistory = result.history || conversationHistory;
        await appendAssistantMessage(result.response, { stream: true });
      } catch (err) {
        statusIndicator.remove();
        const errorText =
          err instanceof Error && err.message
            ? err.message
            : "Couldn't reach the backend. Is it running at http://localhost:8000?";
        appendAssistantMessage(errorText, { stream: false, isError: true });
      } finally {
        setBusy(false);
        input.focus();
      }
    });

    function setBusy(busy) {
      isBusy = busy;
      input.disabled = busy;
      sendBtn.disabled = busy;
    }

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function createRow(role) {
      const row = document.createElement("div");
      row.className = `row ${role}`;

      const wrap = document.createElement("div");
      wrap.className = "bubble-wrap";

      if (role === "assistant") {
        const label = document.createElement("span");
        label.className = "sender";
        label.textContent = "Atlas";
        wrap.appendChild(label);
      }

      const bubble = document.createElement("div");
      bubble.className = `bubble ${role}`;
      wrap.appendChild(bubble);
      row.appendChild(wrap);

      return { row, bubble };
    }

    function appendUserMessage(text) {
      const { row, bubble } = createRow("user");
      bubble.textContent = text;
      messagesEl.appendChild(row);
      scrollToBottom();
    }

    function appendStatusIndicator(message) {
      const { row, bubble } = createRow("assistant");
      bubble.classList.add("status");
      bubble.textContent = message;
      messagesEl.appendChild(row);
      scrollToBottom();

      return {
        row,
        setMessage(nextMessage) {
          bubble.textContent = nextMessage;
          scrollToBottom();
        },
        remove() {
          row.remove();
        },
      };
    }

    async function streamChat(message, history, onStatus) {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, history }),
      });

      if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        const detail = data.detail;
        const errorText =
          typeof detail === "string"
            ? detail
            : Array.isArray(detail)
              ? detail.map((d) => d.msg || JSON.stringify(d)).join(" ")
              : "Something went wrong. Make sure the backend is running on port 8000.";
        throw new Error(errorText);
      }

      if (!response.body) {
        throw new Error("Streaming is not supported in this browser.");
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let result = null;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const chunks = buffer.split("\n\n");
        buffer = chunks.pop() || "";

        for (const chunk of chunks) {
          if (!chunk.trim()) continue;

          const eventLine = chunk
            .split("\n")
            .find((line) => line.startsWith("event: "));
          const dataLine = chunk
            .split("\n")
            .find((line) => line.startsWith("data: "));

          if (!eventLine || !dataLine) continue;

          const eventType = eventLine.slice(7).trim();
          const data = JSON.parse(dataLine.slice(6));

          if (eventType === "status") {
            onStatus(data.message);
          } else if (eventType === "done") {
            result = data;
          } else if (eventType === "error") {
            throw new Error(data.detail || "Something went wrong.");
          }
        }
      }

      if (!result) {
        throw new Error("No response received from Atlas.");
      }

      return result;
    }

    async function appendAssistantMessage(text, { stream = true, isError = false } = {}) {
      const { row, bubble } = createRow("assistant");
      if (isError) bubble.classList.add("error");
      messagesEl.appendChild(row);
      scrollToBottom();

      if (!stream || !text) {
        bubble.textContent = text;
        scrollToBottom();
        return;
      }

      await streamText(bubble, text);
    }

    async function streamText(element, text) {
      const chunkSize = text.length > 600 ? 4 : text.length > 200 ? 3 : 2;
      const delay = text.length > 600 ? 10 : text.length > 200 ? 14 : 18;

      let index = 0;
      element.textContent = "";

      while (index < text.length) {
        element.textContent += text.slice(index, index + chunkSize);
        index += chunkSize;
        scrollToBottom();
        await sleep(delay);
      }
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }
  </script>
</body>
</html>
