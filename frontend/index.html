<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atlas — Travel & Lifestyle Assistant</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f4f4f5;
      --surface: #ffffff;
      --border: #e4e4e7;
      --text: #18181b;
      --text-muted: #71717a;
      --user-bg: #2563eb;
      --user-text: #ffffff;
      --atlas-bg: #ffffff;
      --atlas-text: #27272a;
      --atlas-label: #52525b;
      --input-bg: #ffffff;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      flex-shrink: 0;
      padding: 1rem 1.25rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    header p {
      margin-top: 0.15rem;
      font-size: 0.8125rem;
      color: var(--text-muted);
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .row {
      display: flex;
      width: 100%;
    }

    .row.user { justify-content: flex-end; }
    .row.assistant { justify-content: flex-start; }

    .bubble-wrap {
      display: flex;
      flex-direction: column;
      max-width: min(75%, 36rem);
      gap: 0.25rem;
    }

    .row.user .bubble-wrap { align-items: flex-end; }
    .row.assistant .bubble-wrap { align-items: flex-start; }

    .sender {
      font-size: 0.75rem;
      color: var(--atlas-label);
      padding: 0 0.25rem;
    }

    .row.user .sender { display: none; }

    .bubble {
      padding: 0.65rem 0.9rem;
      border-radius: 1rem;
      line-height: 1.55;
      font-size: 0.9375rem;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: var(--shadow);
    }

    .bubble.user {
      background: var(--user-bg);
      color: var(--user-text);
      border-bottom-right-radius: 0.25rem;
    }

    .bubble.assistant {
      background: var(--atlas-bg);
      color: var(--atlas-text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 0.25rem;
    }

    .bubble.error {
      border-color: #fecaca;
      background: #fef2f2;
      color: #991b1b;
    }

    .bubble.status {
      background: #fafafa;
      color: var(--text-muted);
      font-style: italic;
      border-style: dashed;
    }

    .bubble.approval-card {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      width: 100%;
    }

    .approval-title {
      font-weight: 600;
      font-size: 0.9375rem;
    }

    .approval-field {
      font-size: 0.875rem;
    }

    .approval-field strong {
      font-weight: 600;
      margin-right: 0.25rem;
    }

    .approval-risk {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .risk-badge {
      display: inline-block;
      align-self: flex-start;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .risk-badge.risk-low { background: #dcfce7; color: #166534; }
    .risk-badge.risk-medium { background: #fef3c7; color: #92400e; }
    .risk-badge.risk-high { background: #fee2e2; color: #991b1b; }

    .risk-reasons {
      list-style: disc;
      padding-left: 1.25rem;
      font-size: 0.8125rem;
      color: var(--text-muted);
    }

    .approval-context {
      font-size: 0.8125rem;
      color: var(--text-muted);
      font-style: italic;
    }

    .approval-actions,
    .approval-edit-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    /* [hidden] and .approval-actions/.approval-edit-form both have a single
       class/attribute selector, so without this the cascade's source order
       (this stylesheet loads after the UA stylesheet) lets `display: flex`
       win over the browser's default `[hidden] { display: none }`. */
    .approval-actions[hidden],
    .approval-edit-form[hidden] {
      display: none;
    }

    .approval-btn {
      padding: 0.45rem 0.9rem;
      border-radius: 0.5rem;
      font-size: 0.8125rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: opacity 0.15s, background 0.15s;
    }

    .approval-btn.approve { background: #16a34a; color: #ffffff; }
    .approval-btn.approve:hover:not(:disabled) { background: #15803d; }

    .approval-btn.reject { background: #ffffff; color: #991b1b; border-color: #fecaca; }
    .approval-btn.reject:hover:not(:disabled) { background: #fef2f2; }

    .approval-btn.edit,
    .approval-btn.cancel { background: #ffffff; color: var(--text); border-color: var(--border); }
    .approval-btn.edit:hover:not(:disabled),
    .approval-btn.cancel:hover:not(:disabled) { background: var(--bg); }

    .approval-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .approval-edit-form {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding-top: 0.25rem;
      border-top: 1px solid var(--border);
    }

    .approval-edit-form label {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      font-size: 0.75rem;
      color: var(--atlas-label);
    }

    .approval-edit-form input {
      padding: 0.45rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      background: var(--input-bg);
      color: var(--text);
      font-size: 0.875rem;
      font-family: inherit;
    }

    .approval-edit-form input:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .approval-edit-error {
      font-size: 0.8125rem;
      color: #991b1b;
    }

    .approval-status {
      font-size: 0.8125rem;
      color: var(--text-muted);
      font-style: italic;
      min-height: 1em;
    }

    .composer {
      flex-shrink: 0;
      display: flex;
      gap: 0.5rem;
      padding: 0.875rem 1.25rem;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    #user-input {
      flex: 1;
      padding: 0.7rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 0.625rem;
      background: var(--input-bg);
      color: var(--text);
      font-size: 0.9375rem;
      outline: none;
      transition: border-color 0.15s;
    }

    #user-input:focus {
      border-color: #93c5fd;
    }

    #user-input:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #send-btn {
      padding: 0.7rem 1.1rem;
      background: var(--user-bg);
      color: var(--user-text);
      border: none;
      border-radius: 0.625rem;
      font-size: 0.9375rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    #send-btn:hover:not(:disabled) { background: #1d4ed8; }
    #send-btn:disabled { opacity: 0.55; cursor: not-allowed; }

    @media (max-width: 480px) {
      .bubble-wrap { max-width: 88%; }
      header, .composer { padding-left: 1rem; padding-right: 1rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Atlas</h1>
    <p>Travel & lifestyle assistant — weather, news, and recommendations</p>
  </header>

  <div id="messages" aria-live="polite"></div>

  <form class="composer" id="chat-form">
    <input
      type="text"
      id="user-input"
      placeholder="Ask about weather, news, or trip planning…"
      autocomplete="off"
      aria-label="Message"
    />
    <button type="submit" id="send-btn">Send</button>
  </form>

  <script>
    const API_URL = "/chat/stream";
    const APPROVE_URL = "/approve";
    const WELCOME =
      "Hi, I'm Atlas. I can check live weather, forecast your trip, and pull the latest news for any city. What would you like to know?";

    const form = document.getElementById("chat-form");
    const input = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const messagesEl = document.getElementById("messages");

    let conversationHistory = [];
    // Stable for this whole chat session (one page load = one conversation,
    // matching conversationHistory's lifetime). Sent as conversation_id so
    // the backend's LangGraph checkpointer thread_id stays the same across
    // turns — required for an itinerary proposal's interrupt to still be
    // resumable by a later /approve call in this same conversation.
    let conversationId =
      window.crypto && window.crypto.randomUUID
        ? window.crypto.randomUUID()
        : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    let isBusy = false;

    appendAssistantMessage(WELCOME, { stream: false });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || isBusy) return;

      appendUserMessage(text);
      input.value = "";
      setBusy(true);

      const statusIndicator = appendStatusIndicator("Atlas is thinking...");

      try {
        const result = await streamChat(text, conversationHistory, (message) => {
          statusIndicator.setMessage(message);
        });

        statusIndicator.remove();

        if (result.pendingApproval) {
          appendApprovalCard(result.pendingApproval);
        } else {
          conversationHistory = result.history || conversationHistory;
          await appendAssistantMessage(result.response, { stream: true });
        }
      } catch (err) {
        statusIndicator.remove();
        const errorText =
          err instanceof Error && err.message
            ? err.message
            : "Couldn't reach the server. Make sure all services are running.";
        appendAssistantMessage(errorText, { stream: false, isError: true });
      } finally {
        setBusy(false);
        input.focus();
      }
    });

    function setBusy(busy) {
      isBusy = busy;
      input.disabled = busy;
      sendBtn.disabled = busy;
    }

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function createRow(role) {
      const row = document.createElement("div");
      row.className = `row ${role}`;

      const wrap = document.createElement("div");
      wrap.className = "bubble-wrap";

      if (role === "assistant") {
        const label = document.createElement("span");
        label.className = "sender";
        label.textContent = "Atlas";
        wrap.appendChild(label);
      }

      const bubble = document.createElement("div");
      bubble.className = `bubble ${role}`;
      wrap.appendChild(bubble);
      row.appendChild(wrap);

      return { row, bubble };
    }

    function appendUserMessage(text) {
      const { row, bubble } = createRow("user");
      bubble.textContent = text;
      messagesEl.appendChild(row);
      scrollToBottom();
    }

    function appendStatusIndicator(message) {
      const { row, bubble } = createRow("assistant");
      bubble.classList.add("status");
      bubble.textContent = message;
      messagesEl.appendChild(row);
      scrollToBottom();

      return {
        row,
        setMessage(nextMessage) {
          bubble.textContent = nextMessage;
          scrollToBottom();
        },
        remove() {
          row.remove();
        },
      };
    }

    const APPROVAL_CARD_MARKUP = `
      <div class="approval-title">Itinerary approval needed</div>
      <div class="approval-field"><strong>City:</strong><span data-field="city"></span></div>
      <div class="approval-field"><strong>Dates:</strong><span data-field="dates"></span></div>
      <div class="approval-field"><strong>Notes:</strong><span data-field="notes"></span></div>
      <div class="approval-risk">
        <span class="risk-badge" data-field="risk-badge"></span>
        <ul class="risk-reasons" data-field="risk-reasons"></ul>
      </div>
      <p class="approval-context" data-field="context-note"></p>
      <div class="approval-actions" data-role="actions">
        <button type="button" data-action="approve" class="approval-btn approve">Approve</button>
        <button type="button" data-action="reject" class="approval-btn reject">Reject</button>
        <button type="button" data-action="edit" class="approval-btn edit">Edit</button>
      </div>
      <div class="approval-edit-form" data-role="edit-form" hidden>
        <label>City<input type="text" data-edit="city" /></label>
        <label>Start date<input type="date" data-edit="start_date" /></label>
        <label>End date<input type="date" data-edit="end_date" /></label>
        <label>Notes<input type="text" data-edit="notes" /></label>
        <div class="approval-edit-error" data-field="edit-error"></div>
        <div class="approval-edit-actions">
          <button type="button" data-action="confirm-edit" class="approval-btn approve">Confirm Edit</button>
          <button type="button" data-action="cancel-edit" class="approval-btn cancel">Cancel</button>
        </div>
      </div>
      <div class="approval-status" data-role="status"></div>
    `;

    function appendApprovalCard(pending) {
      const { row, bubble } = createRow("assistant");
      bubble.classList.add("approval-card");
      bubble.innerHTML = APPROVAL_CARD_MARKUP;

      const item = pending.proposed_item;
      const risk = pending.risk;

      // All dynamic values are set via textContent/.value, never innerHTML,
      // since city/notes/context_note/risk reasons can contain LLM- or
      // human-supplied text that shouldn't be interpreted as markup.
      bubble.querySelector('[data-field="city"]').textContent = ` ${item.city}`;
      bubble.querySelector('[data-field="dates"]').textContent =
        ` ${item.start_date} to ${item.end_date}`;
      bubble.querySelector('[data-field="notes"]').textContent =
        ` ${item.notes || "(none)"}`;
      bubble.querySelector('[data-field="context-note"]').textContent =
        pending.context_note || "";

      const badge = bubble.querySelector('[data-field="risk-badge"]');
      badge.textContent = `${risk.level.toUpperCase()} RISK`;
      badge.classList.add(`risk-${risk.level}`);

      const reasonsEl = bubble.querySelector('[data-field="risk-reasons"]');
      if (risk.reasons && risk.reasons.length) {
        risk.reasons.forEach((reason) => {
          const li = document.createElement("li");
          li.textContent = reason;
          reasonsEl.appendChild(li);
        });
      } else {
        reasonsEl.hidden = true;
      }

      bubble.querySelector('[data-edit="city"]').value = item.city;
      bubble.querySelector('[data-edit="start_date"]').value = item.start_date;
      bubble.querySelector('[data-edit="end_date"]').value = item.end_date;
      bubble.querySelector('[data-edit="notes"]').value = item.notes || "";

      messagesEl.appendChild(row);
      scrollToBottom();

      wireApprovalCard(row, bubble, pending.thread_id);
    }

    function wireApprovalCard(row, bubble, threadId) {
      let resolved = false;

      const actionsEl = bubble.querySelector('[data-role="actions"]');
      const editFormEl = bubble.querySelector('[data-role="edit-form"]');
      const statusEl = bubble.querySelector('[data-role="status"]');
      const editErrorEl = bubble.querySelector('[data-field="edit-error"]');

      function setAllDisabled(disabled) {
        bubble.querySelectorAll("button, input").forEach((el) => {
          el.disabled = disabled;
        });
      }

      function setStatus(message) {
        statusEl.textContent = message || "";
      }

      async function handleDecision(decision, editedItem) {
        // Checked and set synchronously, before any await, so a rapid
        // double-click can't slip a second submit in while the first is
        // still in flight — the `disabled` attribute (set in the same
        // synchronous tick) additionally stops a disabled button from ever
        // dispatching a second click event at all.
        if (resolved) return;
        resolved = true;
        setAllDisabled(true);
        setBusy(true);
        setStatus("Atlas is thinking...");

        try {
          const result = await submitApproval(threadId, decision, editedItem, (message) => {
            setStatus(message);
          });

          row.remove();

          if (result.pendingApproval) {
            appendApprovalCard(result.pendingApproval);
          } else {
            conversationHistory = result.history || conversationHistory;
            await appendAssistantMessage(result.response, { stream: true });
          }
        } catch (err) {
          // A definite failure (network error, backend error event) — not a
          // double-submit race — so it's safe to let the user retry rather
          // than leaving a permanently dead card.
          resolved = false;
          setAllDisabled(false);
          setStatus("");
          const errorText =
            err instanceof Error && err.message
              ? err.message
              : "Something went wrong.";
          appendAssistantMessage(errorText, { stream: false, isError: true });
        } finally {
          setBusy(false);
        }
      }

      actionsEl.addEventListener("click", (e) => {
        const action = e.target.closest("button")?.dataset.action;
        if (!action) return;

        if (action === "approve") {
          handleDecision("approve");
        } else if (action === "reject") {
          handleDecision("reject");
        } else if (action === "edit") {
          actionsEl.hidden = true;
          editFormEl.hidden = false;
        }
      });

      editFormEl.addEventListener("click", (e) => {
        const action = e.target.closest("button")?.dataset.action;
        if (!action) return;

        if (action === "cancel-edit") {
          editErrorEl.textContent = "";
          editFormEl.hidden = true;
          actionsEl.hidden = false;
        } else if (action === "confirm-edit") {
          const editedItem = {
            city: editFormEl.querySelector('[data-edit="city"]').value.trim(),
            start_date: editFormEl.querySelector('[data-edit="start_date"]').value,
            end_date: editFormEl.querySelector('[data-edit="end_date"]').value,
            notes: editFormEl.querySelector('[data-edit="notes"]').value.trim(),
          };

          if (!editedItem.city || !editedItem.start_date || !editedItem.end_date) {
            editErrorEl.textContent = "City, start date, and end date are required.";
            return;
          }

          editErrorEl.textContent = "";
          handleDecision("edit", editedItem);
        }
      });
    }

    async function streamChat(message, history, onStatus) {
      return streamSSE(
        API_URL,
        { message, history, conversation_id: conversationId },
        onStatus
      );
    }

    async function submitApproval(threadId, decision, editedItem, onStatus) {
      const body = { thread_id: threadId, decision };
      if (decision === "edit" && editedItem) {
        body.edited_item = editedItem;
      }
      return streamSSE(APPROVE_URL, body, onStatus);
    }

    async function streamSSE(url, body, onStatus) {
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });

      if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        const detail = data.detail;
        const errorText =
          typeof detail === "string"
            ? detail
            : Array.isArray(detail)
              ? detail.map((d) => d.msg || JSON.stringify(d)).join(" ")
              : "Something went wrong. Make sure the backend is running on port 8000.";
        throw new Error(errorText);
      }

      if (!response.body) {
        throw new Error("Streaming is not supported in this browser.");
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let result = null;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const chunks = buffer.split("\n\n");
        buffer = chunks.pop() || "";

        for (const chunk of chunks) {
          if (!chunk.trim()) continue;

          const eventLine = chunk
            .split("\n")
            .find((line) => line.startsWith("event: "));
          const dataLine = chunk
            .split("\n")
            .find((line) => line.startsWith("data: "));

          if (!eventLine || !dataLine) continue;

          const eventType = eventLine.slice(7).trim();
          const data = JSON.parse(dataLine.slice(6));

          if (eventType === "status") {
            onStatus(data.message);
          } else if (eventType === "done") {
            result = data;
          } else if (eventType === "pending_approval") {
            result = { pendingApproval: data };
          } else if (eventType === "error") {
            throw new Error(data.detail || "Something went wrong.");
          }
        }
      }

      if (!result) {
        throw new Error("No response received from Atlas.");
      }

      return result;
    }

    async function appendAssistantMessage(text, { stream = true, isError = false } = {}) {
      const { row, bubble } = createRow("assistant");
      if (isError) bubble.classList.add("error");
      messagesEl.appendChild(row);
      scrollToBottom();

      if (!stream || !text) {
        bubble.textContent = text;
        scrollToBottom();
        return;
      }

      await streamText(bubble, text);
    }

    async function streamText(element, text) {
      const chunkSize = text.length > 600 ? 4 : text.length > 200 ? 3 : 2;
      const delay = text.length > 600 ? 10 : text.length > 200 ? 14 : 18;

      let index = 0;
      element.textContent = "";

      while (index < text.length) {
        element.textContent += text.slice(index, index + chunkSize);
        index += chunkSize;
        scrollToBottom();
        await sleep(delay);
      }
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }
  </script>
</body>
</html>
